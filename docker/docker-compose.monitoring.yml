# ==============================================================================
# Standalone SRE & Observability Stack (Prometheus, Grafana, Node-Exporter)
# Usage: docker compose -f docker/docker-compose.monitoring.yml up -d
# ==============================================================================

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ecommerce-prometheus-standalone
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: ecommerce-grafana-standalone
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_storage:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: ecommerce-node-exporter-standalone
    ports:
      - "9100:9100"
    networks:
      - monitoring-net
    restart: unless-stopped

networks:
  monitoring-net:
    driver: bridge

volumes:
  prometheus_storage:
  grafana_storage:

