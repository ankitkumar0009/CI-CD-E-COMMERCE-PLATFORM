# ==============================================================================
# Production Docker Compose Profile for CloudOps Platform
# Usage: docker compose -f docker/docker-compose.prod.yml up -d
# ==============================================================================

version: '3.8'

services:
  frontend:
    image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ecommerce-platform-frontend:latest
    container_name: ecommerce-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - ecommerce-prod-net

  backend:
    image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ecommerce-platform-backend:latest
    container_name: ecommerce-backend-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ecommerce_devops
      - JWT_SECRET=c2VjdXJlLWVjb21tZXJjZS1qd3QtdG9rZW4tc2VjcmV0LWtleS0yMDI2
    depends_on:
      - mongodb
    networks:
      - ecommerce-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongo-prod
    restart: always
    volumes:
      - prod_mongo_data:/data/db
    networks:
      - ecommerce-prod-net

networks:
  ecommerce-prod-net:
    driver: bridge

volumes:
  prod_mongo_data:
