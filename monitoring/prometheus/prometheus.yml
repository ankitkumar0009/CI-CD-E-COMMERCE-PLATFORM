global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: 'production'
    cluster: 'ecommerce-eks-us-east-1'

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: 'ecommerce-backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:5000', 'host.docker.internal:5000']
        labels:
          service: 'ecommerce-api'
          tier: 'backend'
          environment: 'production'

  - job_name: 'node-exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          tier: 'infrastructure'

  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

