apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: ecommerce-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic only from frontend pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ecommerce-frontend
      ports:
        - protocol: TCP
          port: 5000
    # Allow Prometheus monitoring scraper
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow database access
    - ports:
        - protocol: TCP
          port: 27017
        - protocol: TCP
          port: 3306

