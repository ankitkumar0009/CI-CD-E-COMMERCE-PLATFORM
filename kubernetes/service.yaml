# ==============================================================================
# Kubernetes Services: ClusterIP Internal Discovery
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: ecommerce-backend
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: ecommerce-backend
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ecommerce-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: ecommerce-frontend
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ecommerce-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

