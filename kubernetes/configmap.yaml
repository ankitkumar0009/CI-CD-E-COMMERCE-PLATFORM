apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-backend-config
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: ecommerce-backend
    app.kubernetes.io/part-of: ecommerce-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "Production - AWS EKS"
  AWS_REGION: "us-east-1"
  CORS_ORIGIN: "*"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-frontend-config
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: ecommerce-frontend
    app.kubernetes.io/part-of: ecommerce-platform
data:
  VITE_API_URL: "/api"
  VITE_APP_ENV: "production"
