# ==============================================================================
# Cloud Deployment & CI/CD – E-Commerce Platform
# Local Docker Compose Orchestration (PostgreSQL 16 + FastAPI)
# ==============================================================================

services:
  # 1. PostgreSQL 16 Alpine Database
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - ecommerce-network

  # 2. FastAPI E-Commerce Product & Order Management API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ecommerce_db
      SECRET_KEY: production-secure-ecom-secret-key-2026-min-32-chars-ok
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@ecommerce.local
      ADMIN_PASSWORD: AdminSecret2026!
      ADMIN_FULL_NAME: System Administrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ecommerce-network

volumes:
  postgres_data:
    name: ecommerce_postgres_data

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge
