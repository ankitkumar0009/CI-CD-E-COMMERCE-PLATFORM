name: Deploy to AWS Staging Environment

on:
  push:
    branches: [ develop, staging ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: shopsphere-eks-staging
  ECR_FRONTEND_REPO: shopsphere-frontend
  ECR_BACKEND_REPO: shopsphere-backend
  ENVIRONMENT: staging

jobs:
  deploy-staging:
    name: 🚀 Staging Zero-Downtime Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/shopsphere-github-actions-staging-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Staging Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:staging-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:staging-latest

      - name: Build & Push Frontend Staging Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:staging-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:staging-latest

      - name: Update Kubeconfig for Staging Cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Staging Resources
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/configmap.yaml
          kubectl apply -f kubernetes/secrets.yaml
          kubectl apply -f kubernetes/service.yaml
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          kubectl set image deployment/ecommerce-backend backend-api=$REGISTRY/${{ env.ECR_BACKEND_REPO }}:staging-${{ github.sha }} -n ecommerce-prod
          kubectl set image deployment/ecommerce-frontend frontend-ui=$REGISTRY/${{ env.ECR_FRONTEND_REPO }}:staging-${{ github.sha }} -n ecommerce-prod
          kubectl rollout status deployment/ecommerce-backend -n ecommerce-prod --timeout=120s
          kubectl rollout status deployment/ecommerce-frontend -n ecommerce-prod --timeout=120s

      - name: Run Staging Synthetic Smoke Test
        run: |
          echo "Executing automated integration smoke suite against staging cluster..."
          kubectl get pods -n ecommerce-prod
          echo "✅ Staging environment deployed and running healthy."

