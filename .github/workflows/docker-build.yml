name: Docker Multi-Stage Build & Image Verification

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/Dockerfile*'
      - 'frontend/Dockerfile*'
      - 'docker-compose*.yml'
  pull_request:
    paths:
      - 'backend/Dockerfile*'
      - 'frontend/Dockerfile*'
      - 'docker-compose*.yml'
  workflow_dispatch:

jobs:
  docker-build-verify:
    name: 🐳 Multi-Stage Docker Build & Cache Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "✅ docker-compose.yml configuration valid."

      - name: Build Backend Production Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: shopsphere/backend:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Nginx Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: shopsphere/frontend:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Container Smoke Test
        run: |
          docker run --rm -d --name backend-smoke -p 5000:5000 -e PORT=5000 -e NODE_ENV=production shopsphere/backend:test-${{ github.sha }}
          sleep 5
          docker logs backend-smoke
          curl -f http://localhost:5000/health/live || exit 1
          docker stop backend-smoke
          echo "✅ Backend container started and passed /health/live probe."

