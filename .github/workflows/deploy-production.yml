name: Deploy to AWS Production Environment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Git release tag or SHA to deploy to Production'
        required: true
        default: 'latest'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: ecommerce-eks-cluster
  ECR_FRONTEND_REPO: ecommerce-platform-frontend
  ECR_BACKEND_REPO: ecommerce-platform-backend
  ENVIRONMENT: production

jobs:
  pre-flight-check:
    name: 🔍 Pre-Flight Gate & Sanity Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Release Version
        run: |
          echo "Deploying Production Tag: ${{ github.ref_name || inputs.promote_tag }}"
          test -n "${{ github.ref_name || inputs.promote_tag }}"

  deploy-production:
    name: 🛡️ AWS Production Rolling Zero-Downtime Rollout
    runs-on: ubuntu-latest
    needs: pre-flight-check
    environment:
      name: production
      url: https://shopsphere.internal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/ecommerce-platform-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubeconfig for EKS Cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Apply Kubernetes Production Manifests
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/configmap.yaml
          kubectl apply -f kubernetes/secrets.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/hpa.yaml
          kubectl apply -f kubernetes/pdb.yaml

      - name: Rolling Update Deployment Pods
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          kubectl set image deployment/ecommerce-backend backend-api=$REGISTRY/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }} -n ecommerce-prod
          kubectl set image deployment/ecommerce-frontend frontend-ui=$REGISTRY/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }} -n ecommerce-prod

      - name: Verify Zero-Downtime Rollout Completion
        run: |
          kubectl rollout status deployment/ecommerce-backend -n ecommerce-prod --timeout=180s
          kubectl rollout status deployment/ecommerce-frontend -n ecommerce-prod --timeout=180s

      - name: Production Health Check & Prometheus Verification
        run: |
          echo "Verifying cluster endpoints and active pods..."
          kubectl get pods -n ecommerce-prod -o wide
          echo "✅ Production deployment completed successfully with zero downtime."

